<!doctype html>
<html lang="en" class="dark" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0E0E" />
    <meta
      name="description"
      content="Personal portfolio of Joriz Enriquez, a full-stack developer based in City of San Fernando, Pampanga specializing in FastAPI, React, and PostgreSQL."
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var theme =
            saved === 'slate-sand' || saved === 'sage-stone'
              ? saved
              : 'midnight';
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.classList.toggle('dark', theme !== 'sage-stone');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              'content',
              theme === 'slate-sand'
                ? '#222831'
                : theme === 'sage-stone'
                  ? '#EEEEEE'
                  : '#0B0E0E'
            );
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Joriz Enriquez — Full-Stack Developer</title>
  </head>
  <body class="bg-[var(--bg-base)] text-[var(--fg-primary)] antialiased selection:bg-[var(--accent-tint)] selection:text-[var(--fg-primary)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
